services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promptforge
      POSTGRES_PASSWORD: promptforge
      POSTGRES_DB: promptforge
    ports:
      - "5434:5432"
    volumes:
      - pf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptforge"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - pf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pf_pg_data:
  pf_redis_data:
