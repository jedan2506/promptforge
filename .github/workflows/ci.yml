name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promptforge
          POSTGRES_PASSWORD: promptforge
          POSTGRES_DB: promptforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U promptforge"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgres://promptforge:promptforge@localhost:5432/promptforge
      ADMIN_API_KEY: pf_ci_dummy_admin_key_0000000000000000
      CORS_ORIGIN: http://localhost:4300

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm --filter @promptforge/backend run db:migrate

      - run: pnpm test

      - run: pnpm --filter @promptforge/backend run build
      - run: pnpm --filter @promptforge/sdk run build
      - run: pnpm --filter @promptforge/shared run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: promptforge-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
